name: Build and publish course catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and generate catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out course
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out source-pinned compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scarp-lang/scarp
          ref: b1a9347f93540fdf95b0ddecba4adc55a3b4bb98
          path: .compiler
          persist-credentials: false


      - name: Check out independently pinned alpha.13 workshop compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scarp-lang/scarp
          ref: e755fda37cdaeed29434e848cb5dd41f2f2e7eb2
          path: .compiler-alpha13
          persist-credentials: false

      - name: Check out independently pinned alpha.15 limits compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scarp-lang/scarp
          ref: a21b7b6d942bd1ca9abbbbb522f92f9c8e21e281
          path: .compiler-alpha15
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Unit-test catalog and compiler verifier
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Check browser JavaScript syntax (no dependencies)
        run: |
          node --check site/search-core.js
          node --check site/search.js
          node --check site/checkpoint.js
          node --check site/output-practice.js
          node --check site/reference-explorer.js

      - name: Test source-aware search and chapter filtering
        run: node --test site/test_search_core.cjs site/test_search_dom.cjs

      - name: Test source-backed bilingual checkpoints
        run: node --test site/test_checkpoint.cjs

      - name: Test lesson output prediction interactions
        run: node --test site/test_output_practice.cjs

      - name: Test interactive source reference explorer
        run: node --test site/test_reference_explorer.cjs

      - name: Test accessible mobile navigation
        run: node --test site/test_mobile_navigation.cjs

      - name: Test local progress tracking (no external packages)
        run: |
          node --check site/progress.js
          node --test site/test_progress.cjs site/test_progress_dom.cjs

      - name: Build pinned compiler
        run: cargo build --locked --offline --manifest-path .compiler/Cargo.toml

      - name: Build independently pinned alpha.15 compiler
        run: cargo build --locked --offline --manifest-path .compiler-alpha15/Cargo.toml

      - name: Verify alpha.15 frontend limits and UTF-8 budgets
        run: python scripts/verify_alpha15_limits.py --compiler .compiler-alpha15/target/debug/scarp --compiler-source .compiler-alpha15

      - name: Verify runnable examples before publication
        run: python scripts/verify_examples.py --compiler .compiler/target/debug/scarp

      - name: Verify guided lab starters and exact solution outputs
        run: python scripts/verify_guided_labs.py --compiler .compiler/target/debug/scarp

      - name: Smoke-test Scarp-first CLI before publishing
        run: python scripts/verify_cli.py --compiler .compiler/target/debug/scarp

      - name: Verify modern declarative project before publishing
        run: python scripts/verify_declarative_project.py --compiler .compiler/target/debug/scarp

      - name: Verify legacy-v1 to declarative-v2 migration before publishing
        run: python scripts/verify_project_migration.py --compiler .compiler/target/debug/scarp

      - name: Build historical alpha.13 compiler
        run: cargo build --locked --offline --manifest-path .compiler-alpha13/Cargo.toml

      - name: Verify published alpha.13 collections and Result workshop
        run: python scripts/verify_alpha13_compat.py --compiler .compiler-alpha13/target/debug/scarp --compiler-source .compiler-alpha13

      - name: Generate static course catalog
        run: python scripts/build_site.py

      - name: Audit local links, fragment IDs, canonical URLs and sitemap
        run: python scripts/audit_site.py --site dist

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload verified site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish verified catalog
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
