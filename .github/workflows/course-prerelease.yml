name: Publish verified Scarp by Example prerelease

# A course prerelease requires BOTH main-branch checks on the same commit.
on:
  workflow_run:
    workflows:
      - Verify Scarp examples
      - Build and publish course catalog
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: scarp-by-example-alpha2-prerelease
  cancel-in-progress: false

jobs:
  publish:
    name: Gate and publish v0.1.0-alpha.2
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check current main and successful workflow gates
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: v0.1.0-alpha.2
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected full immutable source SHA"
            exit 1
          fi
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" != "$SOURCE_SHA" ]]; then
            echo "::notice::Triggered by an older main commit; skip"
            exit 0
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::The prerelease already exists"
            exit 0
          fi
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SOURCE_SHA}&per_page=100")"
          for workflow in "Verify Scarp examples" "Build and publish course catalog"; do
            if ! jq -e --arg name "$workflow" --arg sha "$SOURCE_SHA" \
              '[.workflow_runs[] | select(.name == $name and .head_sha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")] | length > 0' \
              <<< "$runs" >/dev/null; then
              echo "::notice::Missing successful workflow: $workflow, SHA $SOURCE_SHA; skip"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check out the verified main source
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Validate complete prerelease contents
        if: steps.gate.outputs.ready == 'true'
        run: python scripts/check_prerelease.py

      - name: Publish prerelease with automatic source archives
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: v0.1.0-alpha.2
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Prerelease already published"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title "Scarp by Example v0.1.0-alpha.2 — Verified alpha.4 projects" \
            --notes-file docs/releases/v0.1.0-alpha.2.md
