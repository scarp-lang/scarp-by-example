name: Verify Scarp examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: example-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Examples / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - name: Check out learning repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned Scarp compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scarp-lang/scarp
          ref: e534e73a81c9500e3aef9f3d51cafa0bc7bbcf75
          path: .compiler
          persist-credentials: false


      - name: Check out independently pinned alpha.13 workshop compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scarp-lang/scarp
          ref: e755fda37cdaeed29434e848cb5dd41f2f2e7eb2
          path: .compiler-alpha13
          persist-credentials: false

      - name: Check out independently pinned alpha.15 limits compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scarp-lang/scarp
          ref: a21b7b6d942bd1ca9abbbbb522f92f9c8e21e281
          path: .compiler-alpha15
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Unit-test verifier
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Build compiler from pinned source
        run: cargo build --locked --offline --manifest-path .compiler/Cargo.toml

      - name: Build historical alpha.15 compiler
        run: cargo build --locked --offline --manifest-path .compiler-alpha15/Cargo.toml

      - name: Build historical alpha.13 compiler
        run: cargo build --locked --offline --manifest-path .compiler-alpha13/Cargo.toml

      - name: Verify alpha.13 collections and result samples (Linux/macOS)
        if: runner.os != 'Windows'
        run: python scripts/verify_alpha13_compat.py --compiler .compiler-alpha13/target/debug/scarp --compiler-source .compiler-alpha13

      - name: Verify alpha.13 collections and result samples (Windows)
        if: runner.os == 'Windows'
        run: python scripts/verify_alpha13_compat.py --compiler .compiler-alpha13/target/debug/scarp.exe --compiler-source .compiler-alpha13

      - name: Verify alpha.15 frontend limits and UTF-8 budgets (Linux/macOS)
        if: runner.os != 'Windows'
        run: python scripts/verify_alpha15_limits.py --compiler .compiler-alpha15/target/debug/scarp --compiler-source .compiler-alpha15

      - name: Verify alpha.15 frontend limits and UTF-8 budgets (Windows)
        if: runner.os == 'Windows'
        run: python scripts/verify_alpha15_limits.py --compiler .compiler-alpha15/target/debug/scarp.exe --compiler-source .compiler-alpha15

      - name: Check every source and exact stdout
        if: runner.os != 'Windows'
        run: python scripts/verify_examples.py --compiler .compiler/target/debug/scarp

      - name: Check every source and exact stdout (Windows)
        if: runner.os == 'Windows'
        run: python scripts/verify_examples.py --compiler .compiler/target/debug/scarp.exe

      - name: Verify guided labs (Linux and macOS)
        if: runner.os != 'Windows'
        run: python scripts/verify_guided_labs.py --compiler .compiler/target/debug/scarp

      - name: Verify guided labs (Windows)
        if: runner.os == 'Windows'
        run: python scripts/verify_guided_labs.py --compiler .compiler/target/debug/scarp.exe

      - name: Smoke-test Scarp-first CLI
        if: runner.os != 'Windows'
        run: python scripts/verify_cli.py --compiler .compiler/target/debug/scarp

      - name: Smoke-test Scarp-first CLI (Windows)
        if: runner.os == 'Windows'
        run: python scripts/verify_cli.py --compiler .compiler/target/debug/scarp.exe

      - name: Verify lowercase declarative project, tests and manifest rejection
        if: runner.os != 'Windows'
        run: python scripts/verify_declarative_project.py --compiler .compiler/target/debug/scarp

      - name: Verify lowercase declarative project, tests and manifest rejection (Windows)
        if: runner.os == 'Windows'
        run: python scripts/verify_declarative_project.py --compiler .compiler/target/debug/scarp.exe
