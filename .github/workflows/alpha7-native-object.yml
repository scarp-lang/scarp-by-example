name: Verify published v0.0.7-alpha.2 native object workshop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-object:
    name: Native object / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: scarp-lang/scarp
          ref: 638dc4c227f34f1c660be66834bcc0cbdb22dec8
          path: .compiler-alpha7-native
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - run: python -m unittest discover -s scripts -p test_alpha7_native_object.py
      - run: cargo build --locked --offline --manifest-path .compiler-alpha7-native/Cargo.toml
      - if: runner.os == 'Linux'
        run: python scripts/verify_alpha7_native_object.py --compiler .compiler-alpha7-native/target/debug/scarp --compiler-source .compiler-alpha7-native --link-host
      - if: runner.os == 'macOS'
        run: python3 scripts/verify_alpha7_native_object.py --compiler .compiler-alpha7-native/target/debug/scarp --compiler-source .compiler-alpha7-native
      - if: runner.os == 'Windows'
        run: python scripts/verify_alpha7_native_object.py --compiler .compiler-alpha7-native/target/debug/scarp.exe --compiler-source .compiler-alpha7-native
